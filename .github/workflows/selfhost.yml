name: Self-scan

# leakproof scanning leakproof. The repository contains a credential generator
# and a list of vendor example values, so it is a genuine adversarial case for
# the context filter rather than a formality.
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read
  security-events: write

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          fetch-depth: 0
      - uses: ruby/setup-ruby@95ef2b042f9d7a56d8268cba8559e2842e2ad01b # v1
        with:
          ruby-version: "3.4"
          bundler-cache: true
      - name: Scan full history
        run: |
          set -o pipefail
          ./exe/leakproof scan . --all-objects --format sarif --fail-on never > leakproof.sarif
          ./exe/leakproof scan . --all-objects --show probable --fail-on confirmed
      - uses: github/codeql-action@cdf488f595d80d6e07e03d4674febd5ab45fa938 # v3
        with:
          sarif_file: leakproof.sarif
        continue-on-error: true
