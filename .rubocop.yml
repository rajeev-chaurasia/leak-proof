plugins:
  - rubocop-rspec

AllCops:
  TargetRubyVersion: 3.3
  NewCops: enable
  SuggestExtensions: false
  Exclude:
    - "vendor/**/*"
    - "tmp/**/*"

Style/Documentation:
  Enabled: false

Style/StringLiterals:
  EnforcedStyle: double_quotes

Style/StringLiteralsInInterpolation:
  EnforcedStyle: double_quotes

Metrics/BlockLength:
  Exclude:
    - "spec/**/*"
    - "*.gemspec"

Layout/LineLength:
  Max: 110

Metrics/MethodLength:
  Max: 15

Metrics/AbcSize:
  Max: 20

RSpec/ExampleLength:
  Max: 20

RSpec/MultipleExpectations:
  Max: 6

RSpec/NestedGroups:
  Max: 4

# ADR 0001: the detection engine must never reach into git. A violation here is
# a lint failure rather than a code review opinion.
Lint/ConstantResolution:
  Enabled: false

# The corpus tier is a table-driven specification of the whole registry, so it
# iterates detectors at definition time rather than describing one class.
RSpec/DescribeClass:
  Exclude:
    - "spec/corpus/**/*"
    - "spec/bench/**/*"
    - "spec/property/**/*"
    - "spec/adversarial/**/*"

RSpec/LeakyLocalVariable:
  Exclude:
    - "spec/corpus/**/*"

# Every sample: declaration reads as a lambda over the synthesizer. Collapsing
# the three single-call ones to &: would make the set inconsistent.
Style/SymbolProc:
  Exclude:
    - "lib/leakproof/detectors/providers/**/*"

# The benchmark builds a corpus of repositories once and grades it. Rebuilding
# it per example would multiply the suite's runtime for no added coverage.
RSpec/BeforeAfterAll:
  Exclude:
    - "spec/bench/**/*"

Lint/ConstantDefinitionInBlock:
  Exclude:
    - "spec/bench/**/*"

RSpec/LeakyConstantDeclaration:
  Exclude:
    - "spec/bench/**/*"
