plugins:
  - rubocop-rspec

AllCops:
  TargetRubyVersion: 3.1
  NewCops: enable
  SuggestExtensions: false
  Exclude:
    - "vendor/**/*"
    - "tmp/**/*"

Style/Documentation:
  Enabled: false

Style/StringLiterals:
  EnforcedStyle: double_quotes

Style/StringLiteralsInInterpolation:
  EnforcedStyle: double_quotes

Metrics/BlockLength:
  Exclude:
    - "spec/**/*"
    - "*.gemspec"

Layout/LineLength:
  Max: 110

Metrics/MethodLength:
  Max: 15

Metrics/AbcSize:
  Max: 20

RSpec/ExampleLength:
  Max: 20

RSpec/MultipleExpectations:
  Max: 6

RSpec/NestedGroups:
  Max: 4

# ADR 0001: the detection engine must never reach into git. A violation here is
# a lint failure rather than a code review opinion.
Lint/ConstantResolution:
  Enabled: false
